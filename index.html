<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #58a6ff; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
    .card h3 { color: #8b949e; font-size: 14px; margin-bottom: 10px; }
    .card .value { font-size: 32px; font-weight: bold; color: #58a6ff; }
    .status-ok { color: #3fb950; }
    .status-warn { color: #d29922; }
    .status-error { color: #f85149; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚢 Fleet Dashboard</h1>
    <div class="grid">
      <div class="card">
        <h3>Scripts</h3>
        <div class="value" id="stat-scripts">—</div>
      </div>
      <div class="card">
        <h3>Cron Jobs</h3>
        <div class="value" id="stat-cron">—</div>
      </div>
      <div class="card">
        <h3>Repos</h3>
        <div class="value" id="stat-repos">—</div>
      </div>
      <div class="card">
        <h3>Services</h3>
        <div class="value" id="stat-services">—</div>
      </div>
    </div>
  </div>
  <script type="module">
    import { getFleetData, getServiceStatus, formatServiceStatus } from './js/data.js';

    const data = getFleetData();

    document.getElementById('stat-scripts').textContent = data.scripts;
    document.getElementById('stat-cron').textContent = data.cronJobs;
    document.getElementById('stat-repos').textContent = data.repos;

    const servicesEl = document.getElementById('stat-services');
    servicesEl.textContent = formatServiceStatus(data.services);
    servicesEl.classList.add(getServiceStatus(data.services.healthy, data.services.total));
  </script>
</body>
</html>
